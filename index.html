<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#EDEEEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Last Hit">
<link rel="manifest" href="manifest.json">
<title>Last Hit</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEEEA;
    --paper-deep:#E3E5DF;
    --ink:#1B1D1F;
    --ink-soft:#53595D;
    --mist:#9AA5AC;
    --slate:#3E4A52;
    --slate-deep:#2C363D;
    --line:#CBCDC7;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    width:100%; height:100dvh;
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #mist-canvas{
    position:fixed; inset:0;
    width:100%; height:100%;
    z-index:0;
  }


  .stage{
    position:relative;
    z-index:1;
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:8vh 6vw;
    text-align:center;
  }

  /* 背景のレンガと重なっても文字が読めるよう、うっすら紙色のパネルを敷く */
  .content-panel{
    background:rgba(237,238,234,0.55);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:28px;
    padding:2.6rem 2.2rem;
    transition:opacity 0.25s ease;
  }
  /* ELAPSEDをタップで枠を消し、下のレンガをタップできるようにする */
  .content-panel.panel-hidden{ opacity:0; pointer-events:none; }
  .eyebrow-tap{
    cursor:pointer;
    padding:0.6rem 1rem;
    margin:-0.6rem -1rem 0.8rem;
    -webkit-tap-highlight-color:transparent;
  }
  .panel-restore{
    display:none;
    position:fixed;
    top:calc(env(safe-area-inset-top, 0px) + 14px);
    left:50%;
    transform:translateX(-50%);
    z-index:2;
    background:rgba(237,238,234,0.7);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    color:var(--ink-soft);
    font-size:0.68rem;
    letter-spacing:0.32em;
    text-transform:uppercase;
    padding:0.5rem 1.1rem;
    border-radius:999px;
  }

  .eyebrow{
    font-size:0.72rem;
    letter-spacing:0.32em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:1.4rem;
    min-height:1em;
  }

  .days-row{
    display:flex;
    align-items:baseline;
    gap:0.6rem;
    line-height:1;
  }

  .days-num{
    font-family:'Zen Old Mincho', serif;
    font-weight:600;
    font-size:clamp(4.5rem, 20vw, 9rem);
    letter-spacing:0.01em;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }

  .days-label{
    font-family:'Zen Old Mincho', serif;
    font-size:clamp(1.1rem, 3vw, 1.5rem);
    color:var(--ink-soft);
    padding-bottom:0.6rem;
  }

  .clock{
    margin-top:0.6rem;
    font-family:'Space Mono', monospace;
    font-size:clamp(1.1rem, 3.6vw, 1.6rem);
    letter-spacing:0.08em;
    color:var(--slate);
    font-variant-numeric:tabular-nums;
  }

  .clock .sep{ color:var(--mist); margin:0 0.15em; }

  .since{
    margin-top:2.2rem;
    font-size:0.82rem;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }

  .since strong{
    color:var(--ink);
    font-weight:500;
  }

  .idle-copy{
    font-family:'Zen Old Mincho', serif;
    font-size:clamp(1.3rem, 4vw, 1.7rem);
    color:var(--ink);
    max-width:20ch;
    line-height:1.7;
    margin-bottom:2.8rem;
  }

  .actions{
    margin-top:3rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1rem;
  }

  button{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.95rem;
    letter-spacing:0.06em;
    border:none;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }

  .btn-start{
    background:var(--slate);
    color:var(--paper);
    padding:1.05rem 3.2rem;
    border-radius:999px;
    font-weight:500;
    transition:background 0.25s ease, transform 0.15s ease;
  }
  .btn-start:hover{ background:var(--slate-deep); }
  .btn-start:active{ transform:scale(0.97); }
  .btn-start:focus-visible{ outline:2px solid var(--slate); outline-offset:4px; }

  .btn-reset{
    background:transparent;
    color:var(--ink-soft);
    padding:0.5rem 1rem;
    border-bottom:1px solid transparent;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  .btn-reset:hover{ color:var(--ink); border-color:var(--line); }
  .btn-reset:focus-visible{ outline:2px solid var(--slate); outline-offset:3px; }

  .confirm-box{
    position:fixed;
    inset:0;
    z-index:5;
    background:rgba(27,29,31,0.42);
    display:none;
    align-items:center;
    justify-content:center;
    padding:6vw;
  }
  .confirm-box.open{ display:flex; }

  .confirm-card{
    background:var(--paper);
    border-radius:18px;
    padding:2.2rem 2rem;
    max-width:320px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.18);
  }
  .confirm-card p{
    font-family:'Zen Old Mincho', serif;
    font-size:1.05rem;
    line-height:1.8;
    margin:0 0 1.6rem;
    color:var(--ink);
  }
  .confirm-row{ display:flex; gap:0.7rem; justify-content:center; }
  .confirm-row button{
    padding:0.7rem 1.3rem;
    border-radius:999px;
    font-size:0.85rem;
  }
  .confirm-cancel{ background:var(--paper-deep); color:var(--ink-soft); }
  .confirm-cancel:hover{ background:var(--line); }
  .confirm-yes{ background:var(--slate); color:var(--paper); }
  .confirm-yes:hover{ background:var(--slate-deep); }

  .footer-note{
    position:fixed;
    bottom:1.4rem;
    left:0; right:0;
    text-align:center;
    font-size:0.68rem;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    opacity:0.55;
    z-index:1;
  }  .history-card{ max-width:340px; width:88vw; text-align:left; }
  .history-title{
    font-family:'Zen Old Mincho', serif;
    font-size:1.05rem;
    color:var(--ink);
    text-align:center;
    margin-bottom:1.2rem;
  }
  .history-toggle{
    display:flex;
    justify-content:center;
    gap:0.4rem;
    margin-bottom:1.1rem;
  }
  .hist-tab{
    background:transparent;
    color:var(--ink-soft);
    font-size:0.78rem;
    letter-spacing:0.04em;
    padding:0.4rem 0.8rem;
    border-radius:999px;
    border:1px solid var(--line);
    transition:background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .hist-tab.active{
    background:var(--slate);
    color:var(--paper);
    border-color:var(--slate);
  }
  .history-list{
    max-height:44vh;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:0.1rem;
  }
  .history-empty{
    font-size:0.85rem;
    color:var(--ink-soft);
    text-align:center;
    padding:1.2rem 0;
  }
  .history-item{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:0.7rem 0.2rem;
    border-bottom:1px solid var(--line);
  }
  .history-item:last-child{ border-bottom:none; }
  .history-rank{
    font-family:'Space Mono', monospace;
    font-size:0.72rem;
    color:var(--mist);
    width:1.6rem;
    flex-shrink:0;
  }
  .history-duration{
    font-family:'Zen Old Mincho', serif;
    font-size:0.98rem;
    color:var(--ink);
    flex:1;
    padding:0 0.5rem;
  }
  .history-date{
    font-family:'Space Mono', monospace;
    font-size:0.66rem;
    color:var(--ink-soft);
    text-align:right;
    white-space:nowrap;
  }
  .history-best .history-duration{ color:var(--slate); font-weight:600; }

  /* メモ */
  .memo-card{ max-width:340px; width:88vw; text-align:left; }
  .memo-day{
    font-family:'Zen Old Mincho', serif;
    font-size:1.15rem;
    font-weight:600;
    color:var(--ink);
    text-align:center;
  }
  .memo-tag{
    display:none;
    text-align:center;
    font-size:0.68rem;
    letter-spacing:0.12em;
    color:var(--mist);
    margin-top:0.15rem;
  }
  .memo-reset-mark{
    position:absolute;
    top:-5px; bottom:-5px;
    width:2px;
    margin-left:-1px;
    background:var(--ink);
    border-radius:1px;
  }
  .memo-row-reset .memo-text{
    font-family:'Zen Old Mincho', serif;
    font-weight:600;
    color:var(--slate);
  }
  .memo-range{
    font-family:'Space Mono', monospace;
    font-size:0.7rem;
    color:var(--ink-soft);
    text-align:center;
    margin:0.2rem 0 1.1rem;
  }
  .log-day{
    font-family:'Zen Old Mincho', serif;
    font-weight:600;
    font-size:0.8rem;
    color:var(--slate);
    margin-right:0.6rem;
  }
  .memo-bar{
    position:relative;
    height:10px;
    border-radius:999px;
    background:var(--paper-deep);
    border:1px solid var(--line);
    margin:0.5rem 0.4rem 0;
  }
  .memo-fill{
    position:absolute; left:0; top:0; bottom:0;
    border-radius:999px;
    background:var(--mist);
    opacity:0.45;
  }
  .memo-dot{
    position:absolute;
    top:50%;
    width:14px; height:14px;
    margin:-7px 0 0 -7px;
    padding:0;
    border-radius:50%;
    background:var(--slate);
    border:2px solid var(--paper);
    box-shadow:0 0 0 1px var(--slate);
  }
  .memo-dot.on{ background:var(--paper); }
  .memo-ticks{
    display:flex;
    justify-content:space-between;
    margin:0.45rem 0.4rem 0;
    font-family:'Space Mono', monospace;
    font-size:0.6rem;
    color:var(--mist);
  }
  .memo-list{
    margin-top:1rem;
    max-height:30vh;
    overflow-y:auto;
  }
  .memo-row{
    display:flex;
    gap:0.6rem;
    align-items:baseline;
    padding:0.55rem 0.2rem;
    border-bottom:1px solid var(--line);
    transition:background 0.2s ease;
  }
  .memo-row:last-child{ border-bottom:none; }
  .memo-row.on{ background:rgba(154,165,172,0.22); }
  .memo-time{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.74rem;
    font-weight:500;
    color:var(--slate);
    white-space:nowrap;
    flex-shrink:0;
    min-width:4.6rem;
  }
  .memo-date{
    font-family:'Space Mono', monospace;
    font-size:0.6rem;
    color:var(--mist);
    white-space:nowrap;
    flex-shrink:0;
  }
  .memo-text{
    flex:1;
    font-size:0.88rem;
    line-height:1.55;
    color:var(--ink);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .memo-del{
    background:transparent;
    color:var(--mist);
    font-size:0.7rem;
    padding:0.1rem 0.3rem;
  }
  .memo-del:hover{ color:var(--ink); }
  .memo-input-row{
    display:none;
    gap:0.5rem;
    margin-top:1rem;
  }
  .memo-input{
    flex:1;
    min-width:0;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:16px; /* iOSの自動ズーム防止 */
    padding:0.6rem 0.8rem;
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(255,255,255,0.6);
    color:var(--ink);
  }
  .memo-input:focus{ outline:2px solid var(--slate); outline-offset:1px; }
  .memo-add{
    background:var(--slate);
    color:var(--paper);
    padding:0 1.1rem;
    border-radius:12px;
    font-size:0.85rem;
  }
  .log-row{
    padding:0.65rem 0.2rem;
    border-bottom:1px solid var(--line);
  }
  .log-row:last-child{ border-bottom:none; }
  .log-date{
    font-family:'Space Mono', monospace;
    font-size:0.64rem;
    color:var(--ink-soft);
  }
  .log-text{
    margin-top:0.2rem;
    font-size:0.88rem;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .log-reset .log-text{
    font-family:'Zen Old Mincho', serif;
    color:var(--slate);
    font-weight:600;
  }
</style>
</head>
<body>

<canvas id="mist-canvas"></canvas>

<div class="stage">

  <!-- 開始前 -->
  <div id="idle-view" class="content-panel">
    <div class="eyebrow">Last Hit</div>
    <div class="idle-copy">吸わなかった時間を、<br>ここに積み上げていく。</div>
    <button class="btn-start" id="start-btn">今から始める</button>
    <div class="actions">
      <button class="btn-reset" id="history-btn-idle">History</button>
    </div>
  </div>

  <!-- 計測中 -->
  <div id="running-view" class="content-panel" style="display:none;">
    <div class="eyebrow eyebrow-tap" id="elapsed-toggle">Elapsed</div>
    <div class="days-row">
      <span class="days-num" id="day-count">0</span>
      <span class="days-label">日</span>
    </div>
    <div class="clock" id="clock-display">00<span class="sep">:</span>00<span class="sep">:</span>00</div>
    <div class="since">
      開始 <strong id="start-date-label">-</strong>
    </div>

    <div class="actions">
      <button class="btn-reset" id="memo-btn">Memo</button>
      <button class="btn-reset" id="history-btn-running">History</button>
      <button class="btn-reset" id="reset-btn">Reset</button>
    </div>
  </div>

</div>

<div class="confirm-box" id="confirm-box">
  <div class="confirm-card">
    <p>記録をリセットして、<br>最初からやり直しますか?</p>
    <div class="confirm-row">
      <button class="confirm-cancel" id="confirm-cancel">やめておく</button>
      <button class="confirm-yes" id="confirm-yes">リセットする</button>
    </div>
  </div>
</div>

<div class="confirm-box" id="history-box">
  <div class="confirm-card history-card">
    <div class="history-title">History</div>
    <div class="history-toggle">
      <button class="hist-tab active" data-mode="duration">長い順</button>
      <button class="hist-tab" data-mode="recent">新しい順</button>
    </div>
    <div class="history-list" id="history-list"></div>
    <div class="confirm-row" style="margin-top:1.6rem;">
      <button class="confirm-cancel" id="history-close">閉じる</button>
    </div>
  </div>
</div>



<button class="panel-restore" id="panel-restore">Elapsed</button>

<div class="confirm-box" id="memo-box">
  <div class="confirm-card memo-card">
    <div class="memo-day" id="memo-day"></div>
    <div class="memo-tag" id="memo-tag"></div>
    <div class="memo-range" id="memo-range"></div>
    <div class="memo-bar" id="memo-bar"></div>
    <div class="memo-ticks"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>24h</span></div>
    <div class="memo-list" id="memo-list"></div>
    <div class="memo-input-row" id="memo-input-row">
      <input class="memo-input" id="memo-input" type="text" maxlength="200" placeholder="いまの気持ち" autocomplete="off">
      <button class="memo-add" id="memo-add">残す</button>
    </div>
    <div class="confirm-row" style="margin-top:1.4rem;">
      <button class="confirm-cancel" id="memo-close">閉じる</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'quitSmokingStart';
  const HISTORY_KEY = 'quitSmokingHistory';
  const NOTES_KEY = 'quitSmokingNotes';     // [{t, text}] Resetしても消さない
  const RESETS_KEY = 'quitSmokingResets';   // [timestamp] Resetした時刻
  const DAY_MS = 86400000;

  const idleView = document.getElementById('idle-view');
  const runningView = document.getElementById('running-view');
  const startBtn = document.getElementById('start-btn');
  const resetBtn = document.getElementById('reset-btn');
  const dayCountEl = document.getElementById('day-count');
  const clockEl = document.getElementById('clock-display');
  const startDateLabel = document.getElementById('start-date-label');
  const confirmBox = document.getElementById('confirm-box');
  const confirmYes = document.getElementById('confirm-yes');
  const confirmCancel = document.getElementById('confirm-cancel');
  const historyBox = document.getElementById('history-box');
  const historyList = document.getElementById('history-list');
  const historyBtnIdle = document.getElementById('history-btn-idle');
  const historyBtnRunning = document.getElementById('history-btn-running');
  const historyClose = document.getElementById('history-close');
  const histTabs = document.querySelectorAll('.hist-tab');
  const memoBtn = document.getElementById('memo-btn');
  const memoBox = document.getElementById('memo-box');
  const memoRange = document.getElementById('memo-range');
  const memoDayEl = document.getElementById('memo-day');
  const elapsedToggle = document.getElementById('elapsed-toggle');
  const panelRestore = document.getElementById('panel-restore');
  let memoDay = null;
  const memoTagEl = document.getElementById('memo-tag');
  let ghostInfo = null; // 表示中のゴースト { start, days }
  const memoBar = document.getElementById('memo-bar');
  const memoList = document.getElementById('memo-list');
  const memoInputRow = document.getElementById('memo-input-row');
  const memoInput = document.getElementById('memo-input');
  const memoAdd = document.getElementById('memo-add');
  const memoClose = document.getElementById('memo-close');
  let hitRects = [];

  let startTime = null;
  let tickHandle = null;
  let historySortMode = 'duration';
  let lastDrawnDays = null;

  function pad(n){ return String(n).padStart(2,'0'); }

  function formatDate(ts){
    const d = new Date(ts);
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }


  function formatDuration(ms){
    const totalMinutes = Math.floor(ms/60000);
    const days = Math.floor(totalMinutes/1440);
    const hours = Math.floor((totalMinutes%1440)/60);
    const minutes = totalMinutes%60;
    if(days > 0) return `${days}日 ${hours}時間`;
    if(hours > 0) return `${hours}時間 ${minutes}分`;
    return `${minutes}分`;
  }

  function loadHistory(){
    try{
      const raw = localStorage.getItem(HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch(e){ return []; }
  }

  function pruneHistory(history){
    const byRecent = history.slice().sort((a,b)=> b.endedAt - a.endedAt).slice(0,10);
    const byDuration = history.slice().sort((a,b)=> b.duration - a.duration).slice(0,10);
    const keepIds = new Set([...byRecent, ...byDuration].map(x=> x.endedAt));
    return history.filter(x=> keepIds.has(x.endedAt));
  }

  function saveAttemptToHistory(durationMs){
    if(durationMs < 60000) return; // 1分未満は記録しない
    let history = loadHistory();
    history.push({ duration: durationMs, endedAt: Date.now() });
    history = pruneHistory(history);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  }

  function loadList(key){
    try{
      const raw = localStorage.getItem(key);
      const v = raw ? JSON.parse(raw) : [];
      return Array.isArray(v) ? v : [];
    } catch(e){ return []; }
  }
  function saveList(key, list){
    try{ localStorage.setItem(key, JSON.stringify(list)); } catch(e){}
  }

  function renderHistory(){
    const history = loadHistory().slice().sort((a,b)=>{
      return historySortMode === 'recent'
        ? b.endedAt - a.endedAt
        : b.duration - a.duration;
    }).slice(0, 7); // 表示は最大7件
    historyList.innerHTML = '';
    if(history.length === 0){
      historyList.innerHTML = '<div class="history-empty">まだ記録がありません</div>';
      return;
    }
    const maxDuration = Math.max(...history.map(x=>x.duration));
    history.forEach((item, i)=>{
      const row = document.createElement('div');
      row.className = 'history-item' + (item.duration === maxDuration ? ' history-best' : '');
      row.innerHTML = `
        <span class="history-rank">${i+1}</span>
        <span class="history-duration">${formatDuration(item.duration)}</span>
        <span class="history-date">${formatDate(item.endedAt)}</span>
      `;
      historyList.appendChild(row);
    });
  }

  function render(){
    const now = Date.now();
    let diff = Math.max(0, now - startTime);
    const totalSeconds = Math.floor(diff/1000);
    const days = Math.floor(totalSeconds/86400);
    const hours = Math.floor((totalSeconds%86400)/3600);
    const minutes = Math.floor((totalSeconds%3600)/60);
    const seconds = totalSeconds%60;

    dayCountEl.textContent = days;
    clockEl.innerHTML = `${pad(hours)}<span class="sep">:</span>${pad(minutes)}<span class="sep">:</span>${pad(seconds)}`;

    if(days !== lastDrawnDays){
      drawBlocks(days);
      lastDrawnDays = days;
    }
  }

  function startTicking(){
    render();
    tickHandle = setInterval(render, 1000);
  }

  function showRunning(){
    idleView.style.display = 'none';
    runningView.style.display = 'flex';
    runningView.style.flexDirection = 'column';
    runningView.style.alignItems = 'center';
    startDateLabel.textContent = formatDate(startTime);
    startTicking();
  }

  function showIdle(){
    runningView.style.display = 'none';
    idleView.style.display = 'flex';
    idleView.style.flexDirection = 'column';
    idleView.style.alignItems = 'center';
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
    lastDrawnDays = 0;
    setPanelHidden(false);
    drawBlocks(0);
  }

  function init(){
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      startTime = parseInt(saved, 10);
      showRunning();
    } else {
      showIdle();
    }
  }

  startBtn.addEventListener('click', function(){
    startTime = Date.now();
    localStorage.setItem(STORAGE_KEY, String(startTime));
    showRunning();
  });

  // --- メモ: 1日(24時間)ぶんのバーにドットを打ち、下に時系列で表示 ---
  function formatShort(ts){
    const d = new Date(ts);
    return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // 時間を「〇時間〇分」の形式にする(1時間未満は「〇分」)
  function formatHM(ms){
    const totalMin = Math.floor(ms / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return h > 0 ? `${h}時間${m}分` : `${m}分`;
  }

  // 過去の記録・今の記録の開始時刻をすべて集める(メモに開始時刻がない場合の補完用)
  function allAttemptStarts(){
    const starts = loadHistory().map(h=> h.endedAt - h.duration);
    if(startTime) starts.push(startTime);
    return starts.sort((a,b)=> a - b);
  }

  // メモ・Resetを「何日目の何時間目か」に直して、全期間ぶんをまとめて返す
  function collectDayEntries(day){
    const starts = allAttemptStarts();
    function startFor(t, s){
      if(s) return s;
      let found = null;
      for(const st of starts){ if(st <= t) found = st; }
      return found;
    }
    const out = [];
    loadList(NOTES_KEY).forEach(function(n){
      const st = startFor(n.t, n.s);
      if(st === null) return;
      const elapsed = n.t - st;
      if(Math.floor(elapsed / DAY_MS) + 1 !== day) return;
      out.push({ type:'note', t:n.t, text:n.text, offset: elapsed % DAY_MS });
    });
    loadList(RESETS_KEY).forEach(function(r){
      const t = (typeof r === 'number') ? r : r.t;
      let st = (typeof r === 'number') ? null : r.s;
      if(!st){
        const h = loadHistory().find(x=> Math.abs(x.endedAt - t) < 5000);
        if(h) st = h.endedAt - h.duration;
      }
      if(!st) return;
      const elapsed = t - st;
      if(Math.floor(elapsed / DAY_MS) + 1 !== day) return;
      out.push({ type:'reset', t:t, text:'Reset', offset: elapsed % DAY_MS });
    });
    // 時系列(その日の何時間目か)の順。別の期間のメモもまとめて並べる
    return out.sort((a,b)=> a.offset - b.offset || a.t - b.t);
  }

  function renderMemo(highlightT){
    memoDayEl.textContent = 'Day' + memoDay;
    memoTagEl.textContent = 'すべての期間のメモ';
    memoTagEl.style.display = 'block';
    memoRange.textContent = '';

    const entries = collectDayEntries(memoDay);

    memoBar.innerHTML = '';
    memoList.innerHTML = '';
    const rows = [];
    const dots = [];
    function highlight(i){
      rows.forEach((r, k)=> r.classList.toggle('on', k === i));
      dots.forEach((d, k)=> d && d.classList.toggle('on', k === i));
      if(rows[i]) rows[i].scrollIntoView({ block:'nearest' });
    }

    entries.forEach(function(n, i){
      const left = (n.offset / DAY_MS * 100) + '%';
      const d = new Date(n.t);
      const row = document.createElement('div');
      row.className = 'memo-row' + (n.type === 'reset' ? ' memo-row-reset' : '');
      const time = document.createElement('span');
      time.className = 'memo-time';
      time.textContent = formatHM(n.offset);
      const text = document.createElement('span');
      text.className = 'memo-text';
      text.textContent = n.text;
      const date = document.createElement('span');
      date.className = 'memo-date';
      date.textContent = `${d.getMonth()+1}/${d.getDate()}`;
      row.appendChild(time);
      row.appendChild(text);
      row.appendChild(date);

      if(n.type === 'note'){
        const dot = document.createElement('button');
        dot.className = 'memo-dot';
        dot.style.left = left;
        dot.setAttribute('aria-label', formatHM(n.offset) + ' ' + n.text);
        dot.addEventListener('click', function(){ highlight(i); });
        memoBar.appendChild(dot);
        dots[i] = dot;

        const del = document.createElement('button');
        del.className = 'memo-del';
        del.textContent = '削除';
        del.addEventListener('click', function(){
          saveList(NOTES_KEY, loadList(NOTES_KEY).filter(x=> !(x.t === n.t && x.text === n.text)));
          renderMemo();
        });
        row.appendChild(del);
      } else {
        const mark = document.createElement('div');
        mark.className = 'memo-reset-mark';
        mark.style.left = left;
        memoBar.appendChild(mark);
      }
      memoList.appendChild(row);
      rows.push(row);
    });

    if(entries.length === 0){
      memoList.innerHTML = '<div class="history-empty">この日のメモはまだありません</div>';
    }
    if(highlightT !== undefined){
      const idx = entries.findIndex(n=> n.type === 'note' && n.t === highlightT);
      if(idx >= 0) highlight(idx);
    }

    // 入力欄は「今まさに進行中の日」を開いた時だけ
    memoInputRow.style.display = (startTime && memoDay === currentDayNumber()) ? 'flex' : 'none';
  }

  function currentDayNumber(){
    return Math.floor((Date.now() - startTime) / DAY_MS) + 1;
  }

  function openMemo(day){
    memoDay = day;
    renderMemo();
    memoBox.classList.add('open');
  }

  memoBtn.addEventListener('click', function(){
    if(!startTime) return;
    openMemo(currentDayNumber());
  });

  function addMemo(){
    const text = memoInput.value.trim();
    if(!text) return;
    const now = Date.now();
    if(memoDay !== currentDayNumber()){ renderMemo(); return; } // 日をまたいだ
    const t = now;
    const notes = loadList(NOTES_KEY);
    notes.push({ t: t, text: text, s: startTime });
    saveList(NOTES_KEY, notes);
    memoInput.value = '';
    renderMemo(t);
  }
  memoAdd.addEventListener('click', addMemo);
  memoInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); addMemo(); }
  });
  memoClose.addEventListener('click', function(){
    memoBox.classList.remove('open');
  });

  // レンガをタップ → その日(24時間)のメモを開く
  function hitTestBrick(px, py){
    // 1) 点が中に入っているレンガ(現在の壁を優先、次にゴースト)
    for(const src of ['now', 'ghost']){
      for(const r of hitRects){
        if(r.src === src && px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return r;
      }
    }
    // 2) 目地など、すき間をタップした場合は一番近いレンガ
    let best = null, bestDist = Infinity;
    for(const r of hitRects){
      const dx = Math.max(r.x - px, 0, px - (r.x + r.w));
      const dy = Math.max(r.y - py, 0, py - (r.y + r.h));
      const dist = Math.hypot(dx, dy);
      if(dist < bestDist){ bestDist = dist; best = r; }
    }
    return (best && bestDist <= 12) ? best : null;
  }

  function setPanelHidden(hidden){
    runningView.classList.toggle('panel-hidden', hidden);
    panelRestore.style.display = hidden ? 'block' : 'none';
  }
  elapsedToggle.addEventListener('click', function(){ setPanelHidden(true); });
  panelRestore.addEventListener('click', function(){ setPanelHidden(false); });

  document.querySelector('.stage').addEventListener('click', function(e){
    if(e.target !== e.currentTarget || !startTime) return;
    const r = hitTestBrick(e.clientX, e.clientY);
    if(r){
      openMemo(r.day);
    } else if(runningView.classList.contains('panel-hidden')){
      setPanelHidden(false);
    }
  });

  resetBtn.addEventListener('click', function(){
    confirmBox.classList.add('open');
  });

  confirmCancel.addEventListener('click', function(){
    confirmBox.classList.remove('open');
  });

  confirmYes.addEventListener('click', function(){
    if(startTime){
      saveAttemptToHistory(Date.now() - startTime);
      const resets = loadList(RESETS_KEY);
      resets.push({ t: Date.now(), s: startTime });
      saveList(RESETS_KEY, resets);
    }
    localStorage.removeItem(STORAGE_KEY);
    confirmBox.classList.remove('open');
    startTime = null;
    showIdle();
  });

  historyBtnIdle.addEventListener('click', function(){
    renderHistory();
    historyBox.classList.add('open');
  });
  historyBtnRunning.addEventListener('click', function(){
    renderHistory();
    historyBox.classList.add('open');
  });
  historyClose.addEventListener('click', function(){
    historyBox.classList.remove('open');
  });

  histTabs.forEach(function(tab){
    tab.addEventListener('click', function(){
      historySortMode = tab.dataset.mode;
      histTabs.forEach(t=> t.classList.remove('active'));
      tab.classList.add('active');
      renderHistory();
    });
  });

  // --- 背景: 経過日数ぶんの層が積み上がっていく表現(アニメーションではなく状態の描画) ---
  const canvas = document.getElementById('mist-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    H = Math.max(H, document.documentElement.clientHeight, window.innerHeight);
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    drawBlocks(lastDrawnDays || 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', resize);
    window.visualViewport.addEventListener('scroll', resize);
  }

  // シード値から常に同じ値を返す疑似乱数(再描画のたびに形が変わらないように)
  function seededRandom(seed){
    const x = Math.sin(seed*12.9898 + 78.233) * 43758.5453;
    return x - Math.floor(x);
  }

  // 0〜n-1 を、seedごとに常に同じ順番でシャッフルした配列を返す
  // (同じ段なら何度描き直しても同じ並び方になる=段(周回)ごとに違う順番)
  function shuffledIndices(n, seed){
    const arr = Array.from({length:n}, (_, k) => k);
    for(let k=n-1; k>0; k--){
      const r = seededRandom(seed*97.7 + k*13.31 + 3.1);
      const j = Math.floor(r * (k+1));
      const tmp = arr[k]; arr[k] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  // 2色を t(0〜1) で補間する簡易的なグラデーション
  function lerpColor(c1, c2, t){
    return [
      Math.round(c1[0] + (c2[0]-c1[0])*t),
      Math.round(c1[1] + (c2[1]-c1[1])*t),
      Math.round(c1[2] + (c2[2]-c1[2])*t)
    ];
  }

  // rows段でちょうどavailableHeightを使い切るような、レンガの寸法を逆算する
  function brickLayoutForRows(rows, availableHeight){
    const heightRatio = 0.46;  // レンガらしい横長比率(高さ/幅)
    const mortarRatio = 0.07;  // 目地(すき間)の太さ(幅に対する比率)
    const brickW = Math.max(14, availableHeight / (rows * (heightRatio + mortarRatio)));
    const brickH = brickW * heightRatio;
    const mortar = Math.max(1, brickW * mortarRatio);
    const bricksPerRow = Math.max(1, Math.ceil(W / (brickW + mortar)));
    const bricksPerRowOffset = bricksPerRow + 1; // 破れ目地でずれる段は1本多く必要
    const rowHeight = brickH + mortar;
    return { brickW, brickH, mortar, bricksPerRow, bricksPerRowOffset, rowHeight };
  }

  // rows段ぶんの合計収容数
  function totalCapacity(layout, rows){
    const pairs = Math.floor(rows / 2);
    const remainder = rows % 2;
    return pairs * (layout.bricksPerRow + layout.bricksPerRowOffset) + remainder * layout.bricksPerRow;
  }

  // targetBricks本がちょうど収まる最小の段数(=一番大きなレンガサイズ)を探して、
  // その段数ぶんで画面の高さをぴったり使い切るレンガサイズを返す
  function computeBrickSizing(targetBricks, availableHeight){
    for(let rows=1; rows<=300; rows++){
      const layout = brickLayoutForRows(rows, availableHeight);
      if(totalCapacity(layout, rows) >= targetBricks){
        return layout;
      }
    }
    return brickLayoutForRows(300, availableHeight);
  }

  // 60から始めて、daysを超えるまで倍々にしていった時の「レベル上限」を返す
  // (60 → 120 → 240 → ...)
  function getLevelTarget(days){
    let levelTarget = 60;
    while(days > levelTarget){
      levelTarget *= 2;
    }
    return levelTarget;
  }

  // Historyの中から一番長い記録を取得する
  function getLongestHistoryRecord(){
    const history = loadHistory();
    if(!history || history.length === 0) return null;
    let longest = history[0];
    for(const item of history){
      if(item.duration > longest.duration) longest = item;
    }
    return longest;
  }

  // レンガの壁をcount個ぶん描画する(色・並び順の乱数はseedOffsetで種を変える)
  function drawWall(count, layout, floorY, marginTop, opacity, seedOffset){
    const { brickW, brickH, mortar, bricksPerRow, bricksPerRowOffset, rowHeight } = layout;
    const colorA = [44, 54, 61];
    const colorB = [140, 150, 158];
    const radius = Math.min(brickW, brickH) * 0.08;
    const seedBase = seedOffset * 100000;
    const collectSrc = seedOffset === 1 ? 'now' : (seedOffset === 99999 ? 'ghost' : null);

    let placed = 0;
    let row = 0;

    while(placed < count){
      const isOffsetRow = (row % 2 === 1);
      const rowCapacity = isOffsetRow ? bricksPerRowOffset : bricksPerRow;
      const rowOrder = shuffledIndices(rowCapacity, seedBase + row);
      const numInThisRow = Math.min(rowCapacity, count - placed);

      const rowOffsetPx = isOffsetRow ? -(brickW + mortar) / 2 : 0;
      const y = floorY - (row + 1) * rowHeight;

      const rowColorT = seededRandom(seedBase + row*31.7 + 4.4);
      const [rowR, rowG, rowB] = lerpColor(colorA, colorB, rowColorT);

      for(let k=0; k<numInThisRow; k++){
        const posInRow = rowOrder[k];
        const x = posInRow * (brickW + mortar) + rowOffsetPx;
        placed++;

        if(y < marginTop - brickH) continue;
        if(x > W || x + brickW < 0) continue;

        if(collectSrc) hitRects.push({ x:x, y:y, w:brickW, h:brickH, day:placed, src:collectSrc });

        const rB = seededRandom(seedBase + row*53.1 + posInRow*7.7 + 1.3);
        const cr = Math.min(255, Math.max(0, Math.round(rowR + (rB-0.5)*70)));
        const cg = Math.min(255, Math.max(0, Math.round(rowG + (rB-0.5)*70)));
        const cb = Math.min(255, Math.max(0, Math.round(rowB + (rB-0.5)*70)));

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x+radius, y);
        ctx.lineTo(x+brickW-radius, y);
        ctx.quadraticCurveTo(x+brickW, y, x+brickW, y+radius);
        ctx.lineTo(x+brickW, y+brickH-radius);
        ctx.quadraticCurveTo(x+brickW, y+brickH, x+brickW-radius, y+brickH);
        ctx.lineTo(x+radius, y+brickH);
        ctx.quadraticCurveTo(x, y+brickH, x, y+brickH-radius);
        ctx.lineTo(x, y+radius);
        ctx.quadraticCurveTo(x, y, x+radius, y);
        ctx.closePath();

        ctx.fillStyle = `rgba(${cr},${cg},${cb},${opacity})`;
        ctx.fill();
        ctx.strokeStyle = `rgba(${Math.round(cr*0.7)},${Math.round(cg*0.7)},${Math.round(cb*0.7)},${opacity})`;
        ctx.lineWidth = Math.max(1, brickH*0.05);
        ctx.stroke();

        ctx.restore();
      }

      row++;
      if(row > 500) break; // 安全弁
    }
  }

  // 1日 = レンガ1個。下の段から順に、段の中はランダムな順番で積んでいく。
  // 60日前後で画面がちょうどいっぱいになるサイズを基準にして、
  // 満タンを超えるたびにターゲットが倍になり、また画面半分くらいから積み直す。
  // Historyの直近の記録は、対応するレベル上限に達するまで薄いゴーストとして背後に残る
  function drawBlocks(days){
    if(!W || !H) return;
    ctx.clearRect(0,0,W,H);
    hitRects = [];
    ghostInfo = null;
    days = days || 0; // 0日目でも過去の最長記録(ゴースト)は表示する

    const marginTop = 60;
    const marginBottom = 0;
    const floorY = H - marginBottom;
    const availableHeight = floorY - marginTop;

    const maxBricks = Math.min(days, 3000);
    const levelTarget = getLevelTarget(maxBricks);
    const currentLayout = computeBrickSizing(levelTarget, availableHeight);

    // 一番長い記録は、その記録に対応するレベル上限に達するまでゴーストとして薄く背後に残す
    // (現在の壁と同じサイズで重ねる)
    const longest = getLongestHistoryRecord();
    const lastRecordDays = longest ? Math.ceil(longest.duration / DAY_MS) : 0; // リセットした日(途中の日)もブロックにする
    if(lastRecordDays && lastRecordDays > 0){
      const hideThreshold = getLevelTarget(lastRecordDays);
      if(maxBricks <= hideThreshold){
        ghostInfo = { start: longest.endedAt - longest.duration, days: lastRecordDays };
        drawWall(lastRecordDays, currentLayout, floorY, marginTop, 0.22, 99999);
      }
    }

    drawWall(maxBricks, currentLayout, floorY, marginTop, 1, 1);
  }

  resize();
  setTimeout(resize, 300); // iOS Safariのツールバー確定後に再計測

  init();

})();
</script>
